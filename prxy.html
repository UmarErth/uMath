        const loadBar = document.getElementById('loadBar');
        const globalPlaceholder = document.getElementById('globalPlaceholder');

        const forwardBtn = document.getElementById('forwardBtn');

        const PRXY_BACKEND = 'https://browserforschool.umarerthteam.workers.dev/?safe_payload=';

        let tabs = [];
        let activeTabId = null;

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'NOVA_NAV_UPDATE') {
                let incomingUrl = event.data.url;
                
                tabs.forEach(tab => {
                    if (tab.iframe.contentWindow === event.source) {
                        tab.url = incomingUrl;
                        if (tab.id === activeTabId) {
                            urlBar.value = incomingUrl;
                        }
                        try {
                            const parsed = new URL(incomingUrl);
                            tab.element.querySelector('.tab-title').textContent = parsed.hostname.replace('www.', '');

        function injectProtectionHooks(iframe) {
            try {
                const win = iframe.contentWindow;
                Object.defineProperty(win, 'top', { get: () => win });
                Object.defineProperty(win, 'parent', { get: () => win });
            } catch (e) {}
        }

        function createTab(initialInput = '') {
            const tabId = 'tab-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = 'trigger-' + tabId;
            tabEl.innerHTML = `
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23bc00dd' stroke-width='2.5'><circle cx='12' cy='12' r='10'/></svg>" class="tab-icon">
                <span class="tab-title">Init...</span>
                <span class="close-tab">&times;</span>
            `;

            const iframe = document.createElement('iframe');
            iframe.id = tabId;

            tabsContainer.appendChild(tabEl);
            contentFrame.appendChild(iframe);

            const tabData = { id: tabId, url: initialInput, title: 'Nova Window', element: tabEl, iframe: iframe };
            tabs.push(tabData);

            tabEl.addEventListener('click', (e) => {
                if (e.target.classList.contains('close-tab')) {
                    e.stopPropagation();
                    closeTab(tabId);
                } else {
                    switchTab(tabId);
                }
            });

            switchTab(tabId);
            if (initialInput) processAndLoadInput(tabId, initialInput);
        }

        function switchTab(tabId) {
            activeTabId = tabId;
            tabs.forEach(t => {
                if (t.id === tabId) {
                    t.element.classList.add('active');
                    t.iframe.classList.add('active');
                    urlBar.value = t.url;
                } else {
                    t.element.classList.remove('active');
                    t.iframe.classList.remove('active');
                }
            });
            const currentActiveTab = tabs.find(t => t.id === tabId);
            if (currentActiveTab && currentActiveTab.url) {
                globalPlaceholder.classList.remove('active');
            } else {
                globalPlaceholder.classList.add('active');
            }
        }

        function closeTab(tabId) {
            const index = tabs.findIndex(t => t.id === tabId);
            if (index === -1) return;
            tabs[index].element.style.transform = 'scale(0)';
            tabs[index].element.style.opacity = '0';
            setTimeout(() => {
                tabs[index].element.remove();
                tabs[index].iframe.remove();
                tabs.splice(index, 1);
                if (activeTabId === tabId) {
                    if (tabs.length > 0) switchTab(tabs[Math.max(0, index - 1)].id);
                    else { activeTabId = null; urlBar.value = ''; globalPlaceholder.classList.add('active'); }
                }
            }, 200);
        }

        function processAndLoadInput(tabId, rawInput) {
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;

            let finalUrl = rawInput.trim();
            const urlPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;
            const isUrl = urlPattern.test(finalUrl) && !finalUrl.includes(' ');

            if (isUrl) {
                if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                    finalUrl = 'https://' + finalUrl;
                }
            } else {
                finalUrl = 'https://search.brave.com/search?q=' + encodeURIComponent(finalUrl);
            }

            tab.url = finalUrl;
            if (activeTabId === tabId) urlBar.value = finalUrl;
            globalPlaceholder.classList.remove('active');
            
            try {
                const parsedDomain = new URL(finalUrl).hostname;
                tab.element.querySelector('.tab-title').textContent = parsedDomain.replace('www.', '');
                tab.element.querySelector('.tab-icon').src = `https://www.google.com/s2/favicons?domain=${parsedDomain}&sz=32`;
            } catch (e) {
                tab.element.querySelector('.tab-title').textContent = rawInput;
            }

            loadBar.style.width = '40%';
            const encryptedPayload = btoa(unescape(encodeURIComponent(finalUrl)));
            tab.iframe.src = PRXY_BACKEND + encryptedPayload;

            tab.iframe.onload = () => {
                injectProtectionHooks(tab.iframe);
                loadBar.style.width = '100%';
                setTimeout(() => { loadBar.style.width = '0%'; }, 300);
            };
        }

        backBtn.addEventListener('click', () => {
            if (!activeTabId) return;
            const activeTab = tabs.find(t => t.id === activeTabId);
            if (activeTab && activeTab.iframe) {
                activeTab.iframe.contentWindow.postMessage({ type: 'NOVA_HISTORY_BACK' }, '*');
            }

        forwardBtn.addEventListener('click', () => {
            if (!activeTabId) return;

            if (activeTab && activeTab.iframe) {
                activeTab.iframe.contentWindow.postMessage({ type: 'NOVA_HISTORY_FORWARD' }, '*');
            }
        });

        reloadBtn.addEventListener('click', () => {
            if (!activeTabId) return;
            const activeTab = tabs.find(t => t.id === activeTabId);
            if (activeTab && activeTab.iframe) {
                loadBar.style.width = '50%';
                activeTab.iframe.contentWindow.postMessage({ type: 'NOVA_FORCE_RELOAD' }, '*');

        urlBar.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && activeTabId) processAndLoadInput(activeTabId, urlBar.value.trim());
