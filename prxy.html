<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Gaming Browser</title>
    <style>
        :root {
            /* Nova Gaming Signature Cyberpunk Palette */
            --bg-glow: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #07030d 100%);
            --glass-bg: rgba(15, 10, 25, 0.45);
            --glass-border: rgba(180, 75, 255, 0.18);
            --glass-blur: blur(20px);
            
            --text-main: #f3f0f7;
            --text-muted: #9d8eb3;
            
            --neon-nova: #bc00dd;
            --neon-cyan: #00f0ff;
            --neon-glow: rgba(188, 0, 221, 0.35);
            --cyan-glow: rgba(0, 240, 255, 0.2);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body { 
            background: var(--bg-glow);
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative;
        }

        /* Ambient background glow elements for premium gaming depth */
        body::before {
            content: '';
            position: absolute;
            top: -20%; left: -10%;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(188,0,221,0.15) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            animation: floatGlowOne 20s infinite alternate ease-in-out;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -20%; right: -10%;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(0,240,255,0.1) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            animation: floatGlowTwo 25s infinite alternate ease-in-out;
        }

        /* Top Header Navigation Panel */
        .browser-header { 
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 14px 24px 0 24px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border); 
            z-index: 2;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .header-left-group {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        /* Nova Gaming Branding Wrapper */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, var(--neon-cyan) 50%, var(--neon-nova) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--neon-glow);
            animation: textShine 6s infinite linear;
            background-size: 200% auto;
        }

        .brand-logo svg {
            width: 18px;
            height: 18px;
            fill: url(#nova-gradient);
            filter: drop-shadow(0 0 5px var(--neon-nova));
            animation: spinLogo 12s infinite linear;
        }

        .tabs-container { 
            display: flex; 
            gap: 6px; 
            align-items: flex-end; 
        }
        
        /* Glassmorphic Tab Implementation */
        .tab {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-muted); 
            padding: 10px 20px; 
            border-radius: 12px 12px 0 0;
            font-size: 13px; 
            font-weight: 600; 
            border: 1px solid var(--glass-border); 
            border-bottom: none;
            display: inline-flex; 
            align-items: center; 
            gap: 10px; 
            min-width: 140px;
            max-width: 200px; 
            cursor: pointer; 
            position: relative;
            animation: tabSpawn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform-origin: bottom left;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        
        .tab:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .tab.active { 
            background: rgba(30, 15, 50, 0.6); 
            color: var(--text-main); 
            border-color: rgba(188, 0, 221, 0.4);
            box-shadow: inset 0 4px 12px rgba(188, 0, 221, 0.15);
        }
        
        .tab.active::after { 
            content: ''; 
            position: absolute; 
            bottom: -1px; 
            left: 0; 
            width: 100%; 
            height: 2px; 
            background: linear-gradient(90deg, var(--neon-nova), var(--neon-cyan));
            box-shadow: 0 -2px 10px var(--neon-nova);
        }
        
        .tab img { width: 16px; height: 16px; object-fit: contain; border-radius: 4px; transition: transform 0.3s ease; }
        .tab:hover img { transform: scale(1.1); }
        .tab .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .tab .close-tab { 
            font-size: 16px; 
            margin-left: auto; 
            color: var(--text-muted); 
            width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .tab .close-tab:hover { 
            background: rgba(255, 91, 91, 0.2);
            color: #ff5b5b; 
            transform: rotate(90deg);
        }

        .new-tab-btn { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid var(--glass-border); 
            color: var(--text-muted); 
            font-size: 18px; 
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; 
            border-radius: 8px;
            margin-bottom: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .new-tab-btn:hover { 
            background: rgba(188, 0, 221, 0.2); 
            color: var(--text-main);
            border-color: var(--neon-nova);
            box-shadow: 0 0 10px var(--neon-glow);
            transform: scale(1.05);
        }
        .new-tab-btn:active { transform: scale(0.95); }

        /* Navbar & Cyberpunk Omnibox Input Layout */
        .navbar { 
            background: rgba(12, 6, 20, 0.4);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 14px 24px; 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid var(--glass-border); 
            z-index: 2;
        }
        
        .url-bar-container { flex-grow: 1; position: relative; }
        
        .url-bar { 
            width: 100%; 
            background: rgba(5, 2, 10, 0.6); 
            border: 1px solid var(--glass-border); 
            border-radius: 14px; 
            padding: 12px 24px; 
            color: var(--text-main); 
            font-size: 14px; 
            outline: none; 
            transition: all 0.4s ease;
            letter-spacing: 0.5px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
            animation: pulseBorder 4s infinite alternate ease-in-out;
        }
        
        .url-bar:focus { 
            border-color: var(--neon-cyan); 
            box-shadow: 0 0 20px var(--cyan-glow), inset 0 2px 8px rgba(0,0,0,0.8);
            background: rgba(5, 2, 10, 0.8); 
            animation: none; /* Disables ambient pulse during interactive typing focus states */
        }

        /* Micro loading bar stream lines */
        .loading-bar { 
            position: absolute; top: 0; left: 0; height: 3px; width: 0%; 
            background: linear-gradient(90deg, var(--neon-nova), var(--neon-cyan), var(--neon-nova)); 
            background-size: 200% auto;
            box-shadow: 0 0 12px var(--neon-cyan);
            transition: width 0.4s cubic-bezier(0.1, 0.8, 0.3, 1); 
            z-index: 10; 
            animation: textShine 2s infinite linear;
        }
        
        /* Main Application Frame Workspace viewport container */
        .content-frame { flex-grow: 1; background: transparent; position: relative; z-index: 1; }
        
        iframe { 
            width: 100%; height: 100%; border: none; 
            background: #ffffff; 
            display: none; 
            border-radius: 0px;
        }
        iframe.active { display: block; animation: iframeFadeIn 0.4s ease forwards; }

        /* FIXED ANIMATION COMPONENT: Dynamic Center Hub Panel Container */
        .placeholder-message { 
            position: absolute; 
            top: 50%; left: 50%; 
            /* Fixed default standard positioning transforms to prevent jumping bugs */
            transform: translate(-50%, -50%) scale(0.9); 
            text-align: center; max-width: 480px; padding: 44px; 
            border-radius: 24px; 
            background: rgba(15, 8, 25, 0.5); 
            border: 1px solid rgba(188, 0, 221, 0.25); 
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 40px rgba(188,0,221,0.05); 
            
            /* Structural fix: Instead of display toggling, we map opacity states cleanly */
            opacity: 0;
            pointer-events: none;
            filter: blur(8px);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }
        
        /* Interactive triggered class state styling */
        .placeholder-message.active { 
            opacity: 1;
            pointer-events: auto;
            filter: blur(0px);
            transform: translate(-50%, -50%) scale(1);
        }
        
        .placeholder-message .hub-icon-wrap {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, rgba(188,0,221,0.2), rgba(0,240,255,0.2));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px auto;
            box-shadow: 0 0 20px rgba(188,0,221,0.2);
            transition: transform 0.4s ease;
        }
        
        .placeholder-message:hover .hub-icon-wrap {
            transform: scale(1.1) rotate(5deg);
        }

        .placeholder-message .hub-icon-wrap svg {
            width: 32px; height: 32px;
            fill: url(#nova-gradient);
        }

        .placeholder-message h1 { 
            font-size: 26px; font-weight: 800; margin-bottom: 14px; letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 40%, var(--neon-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .placeholder-message p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

        /* ADVANCED CYBERPUNK CSS ANIMATION TIMELINE SCHEMES */
        @keyframes tabSpawn {
            from { opacity: 0; transform: translateY(15px) scaleX(0.8); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0) scaleX(1); filter: blur(0); }
        }

        @keyframes iframeFadeIn {
            from { opacity: 0; transform: scale(0.995); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseBorder {
            0% { border-color: var(--glass-border); box-shadow: 0 0 0px transparent; }
            100% { border-color: rgba(0, 240, 255, 0.35); box-shadow: 0 0 8px rgba(0, 240, 255, 0.1); }
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        @keyframes spinLogo {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes floatGlowOne {
            0% { transform: translate(0px, 0px) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.15); }
        }

        @keyframes floatGlowTwo {
            0% { transform: translate(0px, 0px) scale(1); }
            100% { transform: translate(-50px, -20px) scale(1.1); }
        }
    </style>
</head>
<body>

    <!-- SVG Gradients Reference Tree Storage Map -->
    <svg style="width:0;height:0;position:absolute;">
        <linearGradient id="nova-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="100%" stop-color="#bc00dd" />
        </linearGradient>
    </svg>

    <div class="loading-bar" id="loadBar"></div>

    <!-- Application Top Layout Strip Panel Structure -->
    <div class="browser-header">
        <div class="header-left-group">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.857 1.4-8.168L.133 9.21l8.2-1.192z"/>
                </svg>
                Nova Gaming
            </div>
            <div class="tabs-container" id="tabsContainer"></div>
        </div>
        <button class="new-tab-btn" id="newTabBtn" title="Launch Secured Instance">+</button>
    </div>

    <!-- Navigation Control Ribbon Area Layout mapping -->
    <div class="navbar">
        <div class="url-bar-container">
            <input type="text" class="url-bar" id="urlBar" placeholder="Launch clean stealth proxies or initiate secure Brave queries instantly...">
        </div>
    </div>

    <!-- Viewport Execution Dashboard Core Interface Workspace Canvas wrapper -->
    <div class="content-frame" id="contentFrame">
        <div class="placeholder-message active" id="globalPlaceholder">
            <div class="hub-icon-wrap">
                <svg viewBox="0 0 24 24">
                    <path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.857 1.4-8.168L.133 9.21l8.2-1.192z"/>
                </svg>
            </div>
            <h1>Nova Gaming Browser</h1>
            <p>Browse freely on your locked-down school chromebook. novagaming.pages.dev </p>
        </div>
    </div>

    <script>
        const urlBar = document.getElementById('urlBar');
        const tabsContainer = document.getElementById('tabsContainer');
        const contentFrame = document.getElementById('contentFrame');
        const newTabBtn = document.getElementById('newTabBtn');
        const loadBar = document.getElementById('loadBar');
        const globalPlaceholder = document.getElementById('globalPlaceholder');
        
        const PROXY_BACKEND = 'https://browserforschool.umarerthteam.workers.dev/?safe_payload=';

        let tabs = [];
        let activeTabId = null;

        function createTab(initialInput = '') {
            const tabId = 'tab-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = 'trigger-' + tabId;
            tabEl.innerHTML = `
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23bc00dd' stroke-width='2.5'><circle cx='12' cy='12' r='10'/></svg>" class="tab-icon">
                <span class="tab-title">Init...</span>
                <span class="close-tab">&times;</span>
            `;

            const iframe = document.createElement('iframe');
            iframe.id = tabId;

            tabsContainer.appendChild(tabEl);
            contentFrame.appendChild(iframe);

            const tabData = { id: tabId, url: initialInput, title: 'Nova Window', element: tabEl, iframe: iframe };
            tabs.push(tabData);

            tabEl.addEventListener('click', (e) => {
                if (e.target.classList.contains('close-tab')) {
                    e.stopPropagation();
                    closeTab(tabId);
                } else {
                    switchTab(tabId);
                }
            });

            switchTab(tabId);
            if (initialInput) processAndLoadInput(tabId, initialInput);
        }

        function switchTab(tabId) {
            activeTabId = tabId;
            tabs.forEach(t => {
                if (t.id === tabId) {
                    t.element.classList.add('active');
                    t.iframe.classList.add('active');
                    urlBar.value = t.url;
                } else {
                    t.element.classList.remove('active');
                    t.iframe.classList.remove('active');
                }
            });
            const currentActiveTab = tabs.find(t => t.id === tabId);
            
            // Animation class assignment logic for fixed visibility toggling
            if (currentActiveTab && currentActiveTab.url) {
                globalPlaceholder.classList.remove('active');
            } else {
                globalPlaceholder.classList.add('active');
            }
        }

        function closeTab(tabId) {
            const index = tabs.findIndex(t => t.id === tabId);
            if (index === -1) return;
            
            // Give the tab a quick scale shrink animation style hook on exit
            tabs[index].element.style.transform = 'scale(0)';
            tabs[index].element.style.opacity = '0';
            
            setTimeout(() => {
                tabs[index].element.remove();
                tabs[index].iframe.remove();
                tabs.splice(index, 1);
                if (activeTabId === tabId) {
                    if (tabs.length > 0) switchTab(tabs[Math.max(0, index - 1)].id);
                    else { activeTabId = null; urlBar.value = ''; globalPlaceholder.classList.add('active'); }
                }
            }, 200);
        }

        function processAndLoadInput(tabId, rawInput) {
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;

            let finalUrl = rawInput.trim();
            const urlPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;
            const isUrl = urlPattern.test(finalUrl) && !finalUrl.includes(' ');

            if (isUrl) {
                if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                    finalUrl = 'https://' + finalUrl;
                }
            } else {
                finalUrl = 'https://search.brave.com/search?q=' + encodeURIComponent(finalUrl);
            }

            tab.url = rawInput;
            if (activeTabId === tabId) urlBar.value = rawInput;
            globalPlaceholder.classList.remove('active');
            
            try {
                const parsedDomain = new URL(finalUrl).hostname;
                if (parsedDomain === 'search.brave.com') {
                    tab.element.querySelector('.tab-title').textContent = `Brave: "${rawInput}"`;
                } else {
                    tab.element.querySelector('.tab-title').textContent = parsedDomain.replace('www.', '');
                }
                tab.element.querySelector('.tab-icon').src = `https://www.google.com/s2/favicons?domain=${parsedDomain}&sz=32`;
            } catch (e) {
                tab.element.querySelector('.tab-title').textContent = rawInput;
            }

            loadBar.style.width = '40%';

            const encryptedPayload = btoa(unescape(encodeURIComponent(finalUrl)));
            tab.iframe.src = PROXY_BACKEND + encryptedPayload;

            tab.iframe.onload = () => {
                loadBar.style.width = '100%';
                setTimeout(() => { loadBar.style.width = '0%'; }, 300);
            };
        }

        urlBar.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && activeTabId) processAndLoadInput(activeTabId, urlBar.value.trim());
        });

        newTabBtn.addEventListener('click', () => createTab());
        
        // Spawn browser into action ready state
        createTab();
    </script>
</body>
</html>
